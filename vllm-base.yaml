---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jail-pvc-dupe2
  namespace: vllm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  volumeName: jail-pv-dupe2
  storageClassName: slurm-local-pv
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-base
  namespace: vllm
  labels:
    app: vllm
    model: base
    role: server
spec:
  type: LoadBalancer
  selector:
    app: vllm
    model: base
    role: server
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-base
  namespace: vllm
  labels:
    app: vllm
    model: base
    role: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      model: base
      role: server
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vllm
        model: base
        role: server
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-H100-80GB-HBM3
      tolerations:
        - key: "slurm.nebius.ai/nodeset"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve", "/mnt/jail/basemodel",
                    "--served-model-name", "basemodel",
                    "--dtype", "bfloat16",
                    "--host", "0.0.0.0", "--port", "8000"]
          # only use gpu 0, - josh wed 30th
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "64Gi"          # adjust as needed
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180      # 30 minutes max startup
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - name: jail-vol
              mountPath: /mnt/jail
              readOnly: false
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: jail-vol
          persistentVolumeClaim:
            claimName: jail-pvc-dupe2
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi

