apiVersion: v1
kind: Pod
metadata:
  name: test-mount-pod
  namespace: test
spec:
  containers:
  - name: test-container
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: jail-vol
      mountPath: /mnt/jail
  volumes:
  - name: jail-vol
    persistentVolumeClaim:
      claimName: jail-pvc-dupe
  restartPolicy: Never

